# Backend tooling configuration (linting only). The services under services/ are
# plain Lambda folders; their shared dependencies live in requirements.txt.

[tool.ruff]
target-version = "py313"
line-length = 120
# Generated Lambda packages (bin/build-backend.sh) and the template's examples.
extend-exclude = [".build", "_examples"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear: likely bugs
    "UP",   # pyupgrade: modern syntax
    "SIM",  # simplifications
    "N",    # naming conventions
    "C4",   # comprehensions
]

[tool.ruff.lint.per-file-ignores]
# Tests import from conftest after adjusting sys.path.
"tests/**" = ["E402"]
# HTTP error classes are named after their status (NotFound, Conflict...), like Werkzeug's.
"shared/pm_core/errors.py" = ["N818"]

[tool.ruff.lint.isort]
# Service-local modules (imported by bare name inside each Lambda package).
# Service-local modules are imported by bare name inside each Lambda package.
known-first-party = ["pm_core", "queries", "staffing", "routes", "conftest"]
