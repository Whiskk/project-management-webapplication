# Backend tooling configuration (the services themselves are plain Lambda
# folders with their own requirements.txt; this file is only for linting).

[tool.ruff]
target-version = "py313"
line-length = 120
# Vendored packages installed into service folders by bin/start-dev.sh, the
# synced copies of _shared/pm_core, and the template's example services.
extend-exclude = [
    "_examples",
    "*/pm_core",
    "*/psycopg",
    "*/psycopg_binary",
    "*/jwt",
    "*/typing_extensions.py",
    "*/bin",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear: likely bugs
    "UP",   # pyupgrade: modern syntax
    "SIM",  # simplifications
    "N",    # naming conventions
    "C4",   # comprehensions
]

[tool.ruff.lint.per-file-ignores]
# Tests import from conftest after adjusting sys.path.
"tests/*" = ["E402"]
"tests/conftest.py" = ["E402"]

[tool.ruff.lint.isort]
# Service-local modules (imported by bare name inside each Lambda package).
known-first-party = ["pm_core", "project_queries", "project_routes", "staffing", "assignment_routes",
                     "approval_routes", "milestone_routes", "request_routes", "dashboard_routes", "conftest"]
